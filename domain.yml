version: "3.1"

intents:
  - greet
  - start_blackjack
  - get_blackjack_advice
  - practice_blackjack
  - hit
  - stand
  - new_round
  - affirm
  - deny

slots:
  user_input:
    type: text
    mappings:
      - type: from_text

  input_valid:
    type: bool
    mappings:
      - type: custom

  player_hand:
    type: any
    mappings:
      - type: custom

  dealer_upcard:
    type: text
    mappings:
      - type: custom

  player_move:
    type: categorical
    values: [hit, stand]
    mappings:
      - type: from_intent
        intent: hit
        value: hit
      - type: from_intent
        intent: stand
        value: stand

  hand_value:
    type: float
    mappings:
      - type: custom

  is_soft_hand:
    type: bool
    mappings:
      - type: custom

  game_status:
    type: categorical
    values: [collecting, active, bust, stood, blackjack]
    mappings:
      - type: custom

  recommendation:
    type: categorical
    values: [hit, stand]
    mappings:
      - type: custom

  blackjack_mode:
    type: categorical
    values: [advice, practice]
    mappings:
      - type: from_intent
        intent: get_blackjack_advice
        value: advice
      - type: from_intent
        intent: practice_blackjack
        value: practice

  starting_balance:
    type: float
    mappings:
      - type: from_llm

  practice_balance:
    type: float
    mappings:
      - type: custom

  practice_bet:
    type: float
    mappings:
      - type: from_llm

  practice_deck_id:
    type: text
    mappings:
      - type: custom

  cards_remaining:
    type: float
    mappings:
      - type: custom

  practice_player_hand:
    type: any
    mappings:
      - type: custom

  practice_dealer_hand:
    type: any
    mappings:
      - type: custom

  dealer_hole_card:
    type: any
    mappings:
      - type: custom

  practice_status:
    type: categorical
    values: [awaiting_balance, awaiting_bet, player_turn, round_complete, session_complete, api_error]
    mappings:
      - type: custom

  round_result:
    type: categorical
    values: [win, loss, push]
    mappings:
      - type: custom

  continue_playing:
    type: bool
    mappings:
      - type: from_intent
        intent: affirm
        value: true
      - type: from_intent
        intent: deny
        value: false

responses:
  utter_greet:
    - text: "Hi! Would you like blackjack advice, or would you like to practice by playing against me?"
  utter_ask_blackjack_mode:
    - text: "Would you like advice on your cards or a practice game?"
  utter_ask_initial_hand:
    - text: "What are your first two cards? For example: ace and 7."
  utter_invalid_initial_hand:
    - text: "I need exactly two card ranks, such as '10 and 4' or 'ace and 7'."
  utter_ask_dealer_card:
    - text: "What card is the dealer showing?"
  utter_invalid_dealer_card:
    - text: "Please give exactly one dealer card, such as '6' or 'ace'."
  utter_ask_move:
    - text: "Do you want to hit or stand?"
  utter_ask_next_card:
    - text: "What card did you draw?"
  utter_invalid_next_card:
    - text: "Please give one card rank, such as '3', '10', or 'queen'."
  utter_round_complete:
    - text: "Round complete. Say 'new hand' when you want to play again."
  utter_ask_starting_balance:
    - text: "What starting balance would you like?"
  utter_ask_practice_bet:
    - text: "How much would you like to bet?"
  utter_ask_continue_playing:
    - text: "Would you like to play another round?"
  utter_practice_session_complete:
    - text: "Thanks for playing."

actions:
  - action_start_blackjack
  - action_record_initial_hand
  - action_record_dealer_card
  - action_evaluate_blackjack
  - action_record_next_card
  - action_stand_blackjack
  - action_validate_slot_mappings
  - action_start_practice_blackjack
  - action_deal_practice_blackjack
  - action_play_practice_blackjack_move
  - action_continue_practice_blackjack